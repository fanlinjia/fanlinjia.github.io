    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: rgb(172, 180, 248);
            text-align: center;
            font-family: sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            transition: all 200ms ease;
        }
        /* 黑夜模式body */
        body.dark {
            background-color: rgba(50,50,50,1);
        }
        /* 右上角昼夜切换开关 */
        .theme-toggle-wrap{
            position: fixed;
            top:16px;
            right:16px;
            z-index:999;
        }
        .theme-box{
            width: 120px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            cursor:pointer;
            transition: all 200ms ease;
        }
        body.light .theme-box{
            background: #fdd6df;
        }
        body.dark .theme-box{
            background: rgba(70,70,70,1);
        }
        .theme-knob{
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            transition: left 0.2s ease;
        }
        body.light .theme-knob{
            left: 5px;
            background: pink url(image/太阳.png) 6px 7px no-repeat;
            background-size: 35px 35px;
        }
        body.dark .theme-knob{
            left: 65px;
            background: rgba(50,50,50,1) url(image/月亮.png) 6px 7px no-repeat;
            background-size: 35px 35px;
        }

        .main-title {
            color: rgb(60, 63, 255);
            text-shadow: 0 0 20px #003bfd;
            font-size: 42px;
            margin-bottom: 30px;
        }
        body.dark .main-title{
            color:#9396ff;
        }
        .avatar {
            border-radius: 50%;
            border: 4px solid #003bfd;
            box-shadow: 0 0 15px #003bfd;
            width: 300px;
            max-width: 70%;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #003bfd;
        }
        .name-text {
            color: #003bfd;
            text-shadow: 0 0 20px #003bfd;
            font-size: 28px;
            margin-bottom: 40px;
        }
        body.dark .name-text{
            color:#6366ff;
        }
        a {
            text-decoration: none;
            display: block;
            width: 100%;
            max-width: 460px;
            margin: 18px auto;
        }
        @keyframes shake {
            0% {transform: translateX(20px);}
            100% {transform: translateX(-20px);}
        }
        .nav-btn {
            animation: shake 1.5s ease-in-out infinite alternate;
            color: blueviolet;
            text-shadow: 0 0 20px blueviolet;
            font-size: 32px;
            padding: 14px;
            border-radius: 12px;
            background: rgba(138, 43, 226, 0.1);
            transition: all 0.3s;
        }
        .nav-btn:hover {
            background: rgba(138, 43, 226, 0.25);
            transform: scale(1.03);
        }
        .qq-info {
            color: #003bfd;
            text-shadow: 0 0 12px #003bfd;
            font-size: 24px;
            margin-top: 50px;
        }
        body.dark .qq-info{
            color:#6366ff;
        }
        svg {
            width: 28px;
            height: 28px;
            vertical-align: middle;
            margin-right: 10px;
            fill: blueviolet;
        }
        .btn-outer{
            max-width:460px;
            margin:30px auto 0 auto;
        }
        .btn-wrap{
            display:flex;
            gap:12px;
            justify-content:center;
            align-items:center;
            flex-wrap: wrap;
        }
        .music-btn{
            padding:10px 14px;
            font-size:14px;
            border:none;
            border-radius:10px;
            background:#8b5cf6;
            color:white;
            cursor:pointer;
            transition:0.3s;
            flex-shrink:0;
        }
        .music-btn:hover{
            background:#7042d4;
            transform: translateY(-2px);
        }
        .netease-btn{
            width:42px;
            height:42px;
            border-radius:50%;
            background:#c24641;
            border:none;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            transition:0.3s;
            flex-shrink:0;
        }
        .netease-btn:hover{
            transform: translateY(-2px);
            box-shadow:0 4px 12px rgba(194,70,65,0.45);
        }
        .netease-btn svg{
            width:22px;
            height:22px;
            fill:#ffffff;
            margin:0;
        }
        .progress-box{
            flex:1;
            min-width:180px;
        }
        #progressBar{
            width:100%;
            cursor:pointer;
        }
        .time-text{
            display:flex;
            justify-content:space-between;
            font-size:12px;
            color:#222266;
            margin-top:4px;
        }
        body.dark .time-text{
            color:#ccccff;
        }
    </style>
</head>

    <audio id="bgMusic" loop preload="auto">

    <script>
        // 昼夜切换函数
        function openDark(box) {
            let body = document.body;
            if (box.state == null) {
                box.state = false;
            }
            if (box.state) {
                body.className = "light";
            } else {
                body.className = "dark";
            }
            box.state = !box.state;
        }

        const audio = document.getElementById("bgMusic");
        const toggleBtn = document.getElementById("musicToggle");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const totalTimeEl = document.getElementById("totalTime");
        let musicPlayed = false;

        function formatTime(sec){
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return (m<10?"0"+m:m) + ":" + (s<10?"0"+s:s);
        }

        audio.addEventListener("loadedmetadata", ()=>{
            totalTimeEl.innerText = formatTime(audio.duration);
        })

        audio.addEventListener("timeupdate", ()=>{
            progressBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeEl.innerText = formatTime(audio.currentTime);
        })

        progressBar.addEventListener("input", ()=>{
            audio.currentTime = (progressBar.value / 100) * audio.duration;
        })

        document.addEventListener("click",function(){
            if(!musicPlayed){
                audio.play();
                musicPlayed = true;
                toggleBtn.innerText = "关闭背景音乐";
            }
        })

        toggleBtn.addEventListener("click",(e)=>{
            e.stopPropagation();
            if(audio.paused){
                audio.play();
                toggleBtn.innerText = "关闭背景音乐";
            }else{
                audio.pause();
                toggleBtn.innerText = "开启背景音乐";
            }
        })

        window.onload = function() {
            const times = 3;
            for(let i = 1; i <= times; i++) {
                alert(`防人机验证，请点击确定（第${i}/${times}次）`);
            }
        }
    </script>
