<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>范林嘉的网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: rgb(172, 180, 248);
            text-align: center;
            font-family: sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
            transition: all 200ms ease;
        }
        body.dark {
            background-color: rgba(50,50,50,1);
        }
        .theme-toggle-wrap{
            position: fixed;
            top:16px;
            right:16px;
            z-index:999;
        }
        .theme-box{
            width: 120px;
            height: 60px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            cursor:pointer;
            transition: all 200ms ease;
            position:relative;
        }
        body.light .theme-box{
            background: #fdd6df;
        }
        body.dark .theme-box{
            background: rgba(70,70,70,1);
        }
        .theme-knob{
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 25px;
            transition: left 0.2s ease;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        body.light .theme-knob{
            left: 5px;
            background: pink;
        }
        body.dark .theme-knob{
            left: 65px;
            background: #323232;
        }
        .theme-knob svg{
            width:30px;
            height:30px;
            fill:#222;
            margin:0;
        }
        body.dark .theme-knob svg{
            fill:#eee;
        }
        .main-title {
            color: rgb(60, 63, 255);
            text-shadow: 0 0 20px #003bfd;
            font-size: 42px;
            margin-bottom:16px;
        }
        body.dark .main-title{
            color:#9396ff;
        }
        .nav-wrap{
            margin-bottom:16px;
        }
        .nav {
            position: relative;
            border: 1px solid #dfdfdf33;
            border-radius: 999px;
            display: inline-flex;
            list-style: none;
            padding:0;
            box-shadow: 10px 20px 20px #00000033;
            background-color: #f5f5f5;
            height:36px;
        }
        body.dark .nav{
            background-color:#383838;
        }
        .nav li{
            display:flex;
        }
        .nav li a {
            position: relative;
            padding: 0 22px;
            font-weight: 500;
            font-size:16px;
            border: none;
            outline: none;
            display:flex;
            align-items:center;
            text-decoration: none;
            z-index: 3;
            color: rgb(70, 100, 100);
            cursor:pointer;
        }
        body.dark .nav li a{
            color:#c5d0d0;
        }
        .slide,
        .slide-shadow {
            position: absolute;
            display: inline-block;
            top:0;
            height:36px;
            border-radius: 999px;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1.05);
        }
        .slide {
            z-index: 2;
            background-color: rgb(170, 190, 255);
        }
        .slide-shadow {
            opacity: 0;
            z-index: 1;
            background-color: rgba(170, 190, 255, 0.5);
            box-shadow: 0 0 20px #ffffffaa inset;
        }
        .squeeze {
            transform: scale(0.9);
        }
        .page{
            display:none;
        }
        .page.active{
            display:block;
        }
        .avatar {
            border-radius: 50%;
            border: 4px solid #003bfd;

            width: 300px;
            max-width: 70%;

        .avatar:hover {

        .download-box{

    <script>
        const sunSvg = document.querySelector('.sun');
        const moonSvg = document.querySelector('.moon');
        function openDark(box) {
            let body = document.body;
            if (box.state == null) box.state = false;
            if (box.state) {
                body.className = "light";
                sunSvg.style.display="block";
                moonSvg.style.display="none";
            } else {
                body.className = "dark";
                sunSvg.style.display="none";
                moonSvg.style.display="block";
            }
            box.state = !box.state;
        }

        const slide = document.querySelector('.slide');
        const slideShadow = document.querySelector('.slide-shadow');
        const links = Array.from(document.querySelectorAll('.nav a'));
        const homePage = document.getElementById('page-home');
        const downloadPage = document.getElementById('page-download');
        const gamePage = document.getElementById('page-game');

        function switchPage(pageName){
            homePage.classList.remove('active');
            downloadPage.classList.remove('active');
            gamePage.classList.remove('active');
            if(pageName === "home"){
                homePage.classList.add('active');
            }else if(pageName === "download"){
                downloadPage.classList.add('active');
            }else if(pageName === "game"){
                gamePage.classList.add('active');
                snakeGame.init();
            }
        }

        const moveSlide = (targetEl, slideEl) => {
            const navRect = targetEl.closest('.nav').getBoundingClientRect();
            const targetRect = targetEl.getBoundingClientRect();
            const left = targetRect.left - navRect.left;
            const width = targetRect.width;
            slideEl.style.left = `${left}px`;
            slideEl.style.width = `${width}px`;
        };
        const aClick = (el) => {
            moveSlide(el, slide);
            slide.style.opacity = '1';
            const pg = el.getAttribute("data-page");
            switchPage(pg);
        };
        const aMouseover = (el) => {
            moveSlide(el, slideShadow);
            slideShadow.style.opacity = '1';
            slideShadow.classList.add('squeeze');
        };
        const aMouseout = () => {
            slideShadow.style.opacity = '0';
            slideShadow.classList.remove('squeeze');
        };
        links.forEach((el) => {
            el.addEventListener('click', (e)=>{
                e.preventDefault();
                aClick(el);
            });
            el.addEventListener('mouseover', () => aMouseover(el));
            el.addEventListener('mouseout', aMouseout);
        });
        if (links.length) aClick(links[0]);

        const audio = document.getElementById("bgMusic");
        const toggleBtn = document.getElementById("musicToggle");
        const progressBar = document.getElementById("progressBar");
        const currentTimeEl = document.getElementById("currentTime");
        const totalTimeEl = document.getElementById("totalTime");
        let musicPlayed = false;
        function formatTime(sec){
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return (m<10?"0"+m:m) + ":" + (s<10?"0"+s:s);
        }
        audio.addEventListener("loadedmetadata", ()=>{
            totalTimeEl.innerText = formatTime(audio.duration);
        })
        audio.addEventListener("timeupdate", ()=>{
            progressBar.value = (audio.currentTime / audio.duration) * 100;
            currentTimeEl.innerText = formatTime(audio.currentTime);
        })
        progressBar.addEventListener("input", ()=>{
            audio.currentTime = (progressBar.value / 100) * audio.duration;
        })
        document.addEventListener("click",function(){
            if(!musicPlayed){
                audio.play();
                musicPlayed = true;
                toggleBtn.innerText = "关闭背景音乐";
            }
        })
        toggleBtn.addEventListener("click",(e)=>{
            e.stopPropagation();
            if(audio.paused){
                audio.play();
                toggleBtn.innerText = "关闭背景音乐";
            }else{
                audio.pause();
                toggleBtn.innerText = "开启背景音乐";
            }
        })
        window.onload = function() {
            const times = 3;
            for(let i = 1; i <= times; i++) {
                alert(`防人机验证，请点击确定（第${i}/${times}次）`);
            }
        }

        const snakeCanvas = document.getElementById('snakeCanvas');
        const ctx = snakeCanvas.getContext('2d');
        const scoreText = document.getElementById('scoreText');
        const restartBtn = document.getElementById('restartSnake');
        const grid = 20;
        let snakeGame = {
            snake:[],
            food:{x:0,y:0},
            dir:'right',
            nextDir:'right',
            score:0,
            timer:null,
            init:function(){
                clearInterval(this.timer);
                this.snake = [{x:6*grid,y:6*grid}];
                this.dir = 'right';
                this.nextDir = 'right';
                this.score = 0;
                scoreText.innerText = this.score;
                this.createFood();
                this.timer = setInterval(()=>this.update(),120);
            },
            createFood:function(){
                let max = snakeCanvas.width/grid -1;
                this.food.x = Math.floor(Math.random()*max)*grid;
                this.food.y = Math.floor(Math.random()*max)*grid;
            },
            update:function(){
                this.dir = this.nextDir;
                let head = {...this.snake[0]};
                if(this.dir==='right') head.x +=grid;
                if(this.dir==='left') head.x -=grid;
                if(this.dir==='up') head.y -=grid;
                if(this.dir==='down') head.y +=grid;

                const w = snakeCanvas.width;
                const h = snakeCanvas.height;
                if(head.x >= w) head.x = 0;
                if(head.x < 0) head.x = w - grid;
                if(head.y >= h) head.y = 0;
                if(head.y < 0) head.y = h - grid;

                for(let seg of this.snake){
                    if(seg.x===head.x&&seg.y===head.y){
                        clearInterval(this.timer);
                        return;
                    }
                }
                this.snake.unshift(head);
                if(head.x===this.food.x&&head.y===this.food.y){
                    this.score +=10;
                    scoreText.innerText = this.score;
                    this.createFood();
                }else{
                    this.snake.pop();
                }
                this.draw();
            },
            draw:function(){
                ctx.fillStyle="#ffffff";
                ctx.fillRect(0,0,snakeCanvas.width,snakeCanvas.height);
                ctx.fillStyle="#ff4444";
                ctx.fillRect(this.food.x,this.food.y,grid-1,grid-1);
                ctx.fillStyle="#22bb22";
                for(let i=0;i<this.snake.length;i++){
                    let s = this.snake[i];
                    ctx.fillRect(s.x,s.y,grid-1,grid-1);
                }
            }
        };
        document.addEventListener('keydown',(e)=>{
            if(!gamePage.classList.contains('active')) return;
            if(e.key==='ArrowUp'&&snakeGame.dir!=='down') snakeGame.nextDir='up';
            if(e.key==='ArrowDown'&&snakeGame.dir!=='up') snakeGame.nextDir='down';
            if(e.key==='ArrowLeft'&&snakeGame.dir!=='right') snakeGame.nextDir='left';
            if(e.key==='ArrowRight'&&snakeGame.dir!=='left') snakeGame.nextDir='right';
        });
        restartBtn.addEventListener('click',()=>snakeGame.init());
    </script>
</body>
</html>
