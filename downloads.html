<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>应用下载页面</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            background-color: rgb(172, 180, 248);
            font-family: sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        h1{
            margin-bottom: 40px;
            font-size: 42px;
        }
        .shake-title{
            animation: abc 1.5s ease-in-out infinite alternate;
            color: blueviolet;
            text-shadow: 0 0 20px blueviolet;
        }
        .download-box{
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 480px;
        }
        .download-item{
            display: flex;
            flex-direction: column;
        }
        a{
            text-decoration: none;
        }
        .download-btn{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            padding:16px 24px;
            background-color: #6366ff;
            color: white;
            text-align: center;
            border-radius: 12px;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(60,63,255,0.4);
            transition: all 0.3s ease;
        }
        .download-btn:hover{
            background-color: #4346e8;
            transform: translateY(-3px);
            box-shadow: 0 6px 18px rgba(60,63,255,0.55);
        }
        .back-btn{
            background-color: #8b5cf6;
        }
        .back-btn:hover{
            background-color: #7042d4;
        }
        .file-size{
            font-size:14px;
            color:#333366;
            margin-top:8px;
            text-align:center;
        }
        @keyframes abc{
            0% {transform: translateX(20px);}
            100%{transform: translateX(-20px);}
        }
        svg{
            width:22px;
            height:22px;
            fill:white;
        }
    </style>
</head>
<body>
    <h1 class="shake-title">应用下载</h1>
    <div class="download-box">
        <div class="download-item">
            <a href="index.html" class="download-btn back-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                </svg>
                返回首页
            </a>
        </div>

        <div class="download-item">
            <a href="/downloads/steam.exe" download class="download-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                点击下载自制steam
            </a>
            <div class="file-size">文件大小：38.2 MB</div>
        </div>

        <div class="download-item">
            <a href="/downloads/小游戏大全.exe" download class="download-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                点击下载小游戏大全
            </a>
            <div class="file-size">文件大小：126.7 MB</div>
        </div>
    </div>
</body>
</html>
